[package]
name = "opendocu-parser"
description = "Document parsers for OpenDocu (txt/md/html by default; pdf/docx/epub feature-gated)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
opendocu-structures.workspace = true
nom.workspace = true
thiserror.workspace = true

# Default-format parsers
pulldown-cmark = { version = "0.12", default-features = false, optional = true }
html5ever = { version = "0.29", optional = true }
scraper = { version = "0.22", default-features = false, optional = true }

# Optional heavy format parsers
pdf-extract = { version = "0.7", optional = true }
docx-rs = { version = "0.4", default-features = false, optional = true }
epub = { version = "2", optional = true }

[features]
default = ["markdown", "html"]
markdown = ["dep:pulldown-cmark"]
html = ["dep:scraper"]
pdf = ["dep:pdf-extract"]
docx = ["dep:docx-rs"]
epub = ["dep:epub"]
