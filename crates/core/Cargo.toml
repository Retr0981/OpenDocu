[package]
name = "opendocu-core"
description = "Orchestrator crate for OpenDocu: reduce, batch_reduce, streaming"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
opendocu-structures.workspace = true
opendocu-parser.workspace = true
opendocu-summarizer.workspace = true
opendocu-extractor.workspace = true
serde.workspace = true
serde_json.workspace = true
rayon.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
thiserror.workspace = true

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "reduce_bench"
harness = false
